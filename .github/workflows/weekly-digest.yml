name: Weekly AI PM Research Digest

on:
  workflow_dispatch:
  schedule:
    - cron: "0 15 * * MON"

jobs:
  weekly-digest:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Run tests
        run: pytest
      - name: Generate digest
        run: ai-pm-research-agent --lookback-days 7
      - name: Commit report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add reports data || true
          git commit -m "Add weekly AI PM research digest" || echo "No changes to commit"
          git push
