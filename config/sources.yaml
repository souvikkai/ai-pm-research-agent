arxiv:
  enabled: true
  max_results_per_category: 25
  categories:
    - cs.AI
    - cs.CL
    - cs.LG
    - cs.CV
    - stat.ML
  query_terms:
    - inference
    - serving
    - compiler
    - quantization
    - edge
    - robotics
    - evaluation
    - agents

huggingface_papers:
  enabled: true
  limit_per_day: 20
  sort: trending
  note: Uses Hugging Face Daily Papers API for community-surfaced implementation-adjacent papers.

papers_with_code:
  enabled: true
  max_results: 30
  api_url: https://paperswithcode.com/api/v1/papers/
  trending_url: https://paperswithcode.com/trending
  note: Tries the legacy Papers with Code API first; falls back to the current trending page experience if redirected.

